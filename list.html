<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Document</title>
</head>
<body>
    <h1>ordered list</h1>
    <ol>
        <li>apple</li>
        <li>mango</li>
        <li>banana</li>
    </ol>
    <hr>
    <h1>unordered list</h1>
    <ul>
        <li>anshika</li>
        <li>shivam</li>
        <li>kalyani</li>
    </ul>
    <hr>
    <h1>nested list</h1>
    <ol>
        <li>fruits</li>
        <ul>
            <li>mango</li>
            <li>apple</li>
            <li>banana</li>
        </ul>

    </ol>
    
</body>
</html>
